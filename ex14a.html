<!DOCTYPE html>
<html>
    <head>
        <title>14A</title>
        <style>
            div{
                font-family: Arial, Helvetica, sans-serif;
            }
            .right-sidebar{
                position: fixed;
                bottom: 0px;
                right: 0px;
                top:0px;
                background-color: green;
                color: white;
                width: 100px;
            }
            body{
                height: 3000px;
            }
            .overlay{
                position: fixed;
                bottom: 0px;
                right: 0px;
                top:0px;
                left:0;
                background-color: rgba(0,0,0,0.6);
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .modal{
                background-color: white;
                width: 400px;
                height: 150px;
                border-radius: 15px;
                padding-top: 15px;
                padding-bottom: 15px;
                padding-left: 15px;
                padding-right: 15px;
            }
            .title{
                font-size: 30px;
                font-weight: bold;
                margin-bottom: 20px;
            }
            .desc{
                font-size: 15px; 
                margin-bottom: 20px;
            }
        </style>
    </head>
    <body>
        <div class="right-sidebar">
           right sidebar
        </div>
        <div class="overlay">
            <div class="modal">
                <div class="title">Modal title</div>
                <div class="desc">This is a modal</div>
                <button>Close</button>
            </div>
        </div>
    </body>
</html>
