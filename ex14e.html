<!DOCTYPE html>
<html>
    <head>
        <title>
            14E
        </title>
        <style>
            .header{
                position: fixed;
                top: 0px;
                right: 0px;
                left: 0px;
                background-color: white;
                display: flex;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 50px;
                padding-right: 50px;
                justify-content: space-between;
                align-items: center;
            }
            .profile-picture{
                height: 40px;
                width: 40px;
                object-fit: cover;
                border-radius: 20px;
            }
            body{
                height: 3000px;
            }
            .profile-picture-column{
                margin-right: 10px;
                display: flex;
                align-items: center;
            }
            .right-section{
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            div{
                font-family: Arial, Helvetica, sans-serif;
            }
            .name{
                margin-left: 10px;
                font-weight: bold;
            }
            
            .add-friend-button {
                background-color: rgb(24, 119, 242);
                color: white;
                font-weight: bold;
                border: none;
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 12px;
                padding-right: 12px;
                border-radius: 6px;
                margin-right: 3px;
            }
            .message-button {
                background-color: rgb(230, 230, 230);
                border: none;
                font-weight: bold;
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 12px;
                padding-right: 12px;
                border-radius: 6px;
            }

        </style>
    </head>
    <body>
        <div class="header">
            <div class="profile-picture-column">
                <img src="cat.jpg" class="profile-picture">
                <div class="name">Oliver Cat</div>
            </div>
           <div class="right-section">
            <button class="add-friend-button">
                Add friend
            </button>
            <button class="message-button">
                Message
            </button>
           </div>
        </div>
    </body>
</html>
