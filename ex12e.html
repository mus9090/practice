<!DOCTYPE html>
<html>
    <head>
        <title>
            12e
        </title>
        <style>
            div{
                font-family: arial;
            }
            .container{
                border-width: 1px;
                border-style: solid;
                border-color: rgb(200,200,200);
                border-radius: 6px;
                width: 300px;
                
            }
            .flexbox{
                display: flex;
                flex-direction: row;
                justify-content:space-between ;
                align-items: center;
                padding-top: 6px;
                padding-bottom: 6px;
                padding-left: 12px;
                padding-right: 12px;
            }
            .notif{
                background-color: rgb(49, 109, 245);
                font-weight: bold;
                color: white;
                border-radius: 5px;
                padding-top: 3px;
                padding-bottom: 3px;
                padding-left: 10px;
                padding-right: 10px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="flexbox">
                <div>Home</div>
                <div class="notif"> 14</div>
            </div>
            <div class="flexbox">
                <div>Notifications</div>
                <div class="notif"> 3</div>
            </div>
            <div class="flexbox">
                <div>Messages</div>
                <div class="notif">5</div>
            </div>      
        </div>
    </body>
</html>
