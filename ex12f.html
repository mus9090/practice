<!DOCTYPE html>
<html>
    <head>
        <title>
            12f
        </title>
        <style>
            .flexbox{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                background-color: rgb(120, 82, 178);
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 15px;
                padding-right: 15px;
                align-items: center;
            }
            .search-bar{
                width: 500px;
                border: none;
                border-radius: 250px;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 20px;
                padding-right: 20px;
            }
            button {
                background-color: rgb(120, 82, 178);
                color: white;
                font-size: 16px;
                border-width: 1px;
                border-style: solid;
                border-color: white;
                border-radius: 2px;
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 15px;
                padding-right: 15px;
            }
            .home{
                font-weight: bold;
                color: white;
            }
            div{
                font-family: arial;
            }
        </style>
    </head>
    <body>
        <div class="flexbox">
            <div class="home">
                Home
            </div>
            <div>
                <input type="text" class="search-bar" placeholder="Search">
            </div>
            <div>
                <button>Download</button>
            </div>
        </div>
    </body>
</html>
