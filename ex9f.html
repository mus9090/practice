<!DOCTYPE html>
<html>
    <head>
        <style>
            p{
                font-family: arial;
                margin-top: 0px;
                margin-bottom: 0px;
            }
            .cat{
                width: 200px;
                height: 200px;
                object-fit: cover;
                margin-bottom: 10px;
            }
            div{
                box-shadow: 0px 0px 5px rgba(0,0,0,0.3);
                border-width: 1px;
                width: 200px;
                display: inline-block;
                margin-left: 15px;
            }
            .name{
                color: black;
                font-size: 18px;
                font-weight: bold;
                margin-left: 7px;
                margin-bottom: 10px;
            }
            .mutuals{
                margin-left: 7px;
                margin-bottom: 10px;
                color: rgb(100,100,100);
            }
            button{
                background-color: rgb(24, 119, 242);
                color:white;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-right: 20px;
                padding-left: 20px;
                margin-bottom: 10px;
                border: none;
                border-radius: 4px;
                margin-left: 7px;
            }
        </style>
        <title>
            9F
        </title>
    </head>
    <body>
        <div>
            <img src="cat.jpg" class="cat">
            <p class="name">Oliver</p>
            <p class="mutuals">2 mutual friends</p>
            <button> Add friend</button>
        </div>
        <div>
            <img src="cat2.jpg" class="cat">
            <p class="name">Mimi</p>
            <p class="mutuals"> 3 mutual friends</p>
            <button> Add friend</button>
        </div>
        <div>
            <img src="dog.jpg" class="cat">
            <p class="name">Rex</p>
            <p class="mutuals">4 mutual friends</p>
            <button> Add friend</button>
        </div>
    </body>
</html>
