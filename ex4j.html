<style>
    .shadow-button{
        background-color: green;
        color: white;
        padding-top: 8px;
        padding-bottom: 8px;
        padding-left: 16px ;
        padding-right: 16px;
        border: none;
        cursor: pointer;
        box-shadow: 3px 3px 5px rgba(0 ,0 ,0 ,0.3);
        transition: box-shadow 0.15s;
    }
    .shadow-button:active{
        box-shadow: none;
        margin-top: 3px;
        margin-left: 3px;
    }
</style>
<button class="shadow-button">
    Shadow
</button>
