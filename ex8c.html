<!DOCTYPE html>
<html>
    <head>
        <style>
            input{
                width: 500px;
                padding-top: 12px;
                padding-bottom: 12px;
                padding-left: 15px;
                padding-right:15px ;
                border: none;
                border-radius: 30px;
                box-shadow: 0px 1px 5px rgba(0,0,0,0.25);
                margin-bottom: 30px;
                font-size: 16px;
            }
            img{
                width:200px;
                margin-bottom: 10px;
                margin-top: 10px;
            }
            div{
                text-align: center;
            }
            button{
                padding-top: 10px;
                padding-bottom:10px;
                padding-right: 20px;
                padding-left: 20px;
                border: none;
                background-color: rgb(245, 245, 245);
                font-size: 15px;
                margin-right: 10px;
                font-size: 15px;
                
            }
        </style>
    </head>
    <body>
        <div>
            <img src="google-logo.png">
        </div>
        <div>
            <input type="text" placeholder="Search Google or type a URL">
        </div>
        <div>
            <button class="search-bar">
                Google Search
            </button>
            <button class="lucky-bar">
                I'm Feeling Lucky
            </button>
        </div>
    </body>
</html>
