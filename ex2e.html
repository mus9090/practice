<style>
    .apply-button{
        background-color: rgb(10, 102, 194);
        color: white;
        font-weight: bold;
        padding-top:10px ;
        padding-bottom:10px ;
        padding-right:20px ;
        padding-left: 20px;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        margin-right: 8px;
        transition: background-color 0.15s;
    }
    .apply-button:hover{
        background-color: rgb(2, 70, 138);

    }
    .apply-button:active{
        opacity:0.7 ;

    }
    .save-button{
        background-color: white;
        color:rgb(10, 102, 194);
        border-width: 1px;
        border-color: rgb(10, 102, 194);
        border-radius:18px;
        padding-top:10px ;
        padding-bottom:10px ;
        padding-right:20px ;
        padding-left: 20px;
        cursor: pointer;
        border-style: solid;
        font-weight: bold;
        transition: border-width 0.15s ;

    }
    .save-button:hover{
        border-width: 2px;
        background-color: rgb(226, 240, 254);
    }
</style>
<button class="apply-button">
    Apply on company website
</button>
<button class="save-button">
    Save
</button>
