<!DOCTYPE html>
<html>
    <head>
        <title>
            14F
        </title>
        <style>
            div{
                font-family: Arial, Helvetica, sans-serif;
            }
            body{
                height: 3000px;
            }
            .sidebar1{
                display: flex;
                flex-direction: column;
                position: fixed;
                top:0px;
                bottom: 0px;
                left: 0px;
                width: 60px;
                background-color: rgb(33, 33, 33);
            }
            .picture{
                margin-top: 5px;
                margin-bottom: 5px;
                height: 50px;
                width: 50px;
                object-fit: cover;
                border-radius: 25px;
            }
            .sidebar2{
                display: flex;
                flex-direction: column;
                position: fixed;
                width: 150px;
                top: 0px;
                bottom:0px;
                left:60px;
                background-color: rgb(55,55,55);
                padding-top: 15px;
                padding-left: 15px;
                padding-right: 15px;
            }
            .header{
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 10px;      
            }
            .name{
                font-size: 14px;
                color: white;
            }
            .create-new{
                color: rgb(150, 150, 150);
                font-size: 25px;
            }
            .channel{
                color: rgb(150,150,150);
                margin-bottom: 15px;
            }

        </style>
    </head>
    <body>
        <div class="sidebar1">
            <div>
                <img src="cat.jpg" class="picture">
            </div>
            <div>
                <img src="cat2.jpg" class="picture">
            </div>
            <div>
                <img src="dog.jpg" class="picture">
            </div>
        </div>
        <div class="sidebar2">
            <div class="header">
                <div class="name">INFO</div>
                <div class="create-new">+</div>
            </div>
            <div class="channel">
                # new-videos
            </div>
            <div class="channel">
                # updates
            </div>
            <div class="channel">
                # faq
            </div>
        </div>
    </body>
</html>
