<!DOCTYPE html>
<html>
    <head>
        <title>
            15b
        </title>
        <style>
            .container{
                background-color: gray;
                position: fixed;
                width: 320px;
                height: 180px;
                bottom: 15px;
                right:15px;
            }
            .close{
                position: absolute;
                top: -8px;
                left:-8px;
                background-color: black;
                color:white;
                font-family: Arial, Helvetica, sans-serif;
                padding-top: 4px;
                padding-bottom: 4px;
                padding-left: 6px;
                padding-right: 6px;
                border-radius: 25px;
                font-size: 12px;
            }
            .timestamp{
                position: absolute;
                bottom:10px;
                right:10px;
                background-color: black;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
                padding-left: 5px;
                padding-right: 5px;
                padding-top: 4px;
                padding-bottom: 4px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="close">
                X
            </div>
            <div class="timestamp">
                0:29
            </div>   
        </div>
    </body>
</html>
