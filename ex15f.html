<!DOCTYPE html>
<html>
    <head>
        <title>
            15f
        </title>
        <style>
            .container{
                position: relative;
                display: inline-block;
            }
            .image{
                height: 400px;
                width: 400px;
                object-fit: cover;
            }
            .discount{
                position: absolute;
                top:10px;
                right:0px;
                background-color: black;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
                padding-top: 5px;
                padding-bottom: 5px;
                padding-left: 10px;
                padding-right: 10px;
            }
            .add-to-cart-container{
                position: absolute;
                bottom:0px;
                left:0px;
                right:0px;
                height:100px;
                background-color: rgba(255, 255, 255,0.8);
                display: flex;
                justify-content: center;
                align-items: center;
            }
            button{
                color: black;
                border-color: black;
                border-style: solid;
                font-family: Arial, Helvetica, sans-serif;
                border-width: 1px;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 20px;
                padding-right: 20px;
                background-color: white;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <img src="shirt.jpg" class="image">
            <div class="discount">20% off</div>
            <div class="add-to-cart-container">
                <button>Add to cart</button>
            </div>
        </div>
    </body>
</html>
